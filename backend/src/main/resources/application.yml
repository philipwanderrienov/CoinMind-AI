spring:
  application:
    name: coinmind-backend
  r2dbc:
    url: ${DATABASE_URL:r2dbc:postgresql://localhost:5432/coinmind}
    username: ${POSTGRES_USER:coinmind}
    password: ${POSTGRES_PASSWORD:change_me}

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

coinmind:
  persistence:
    enabled: ${PERSISTENCE_ENABLED:false}

  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
    model: ${AI_MODEL:gpt-5.6-luna}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com}
    reasoning-effort: ${AI_REASONING_EFFORT:low}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:400}
    input-price-micros-per-million: ${AI_INPUT_PRICE_MICROS_PER_MILLION:200000}
    cached-input-price-micros-per-million: ${AI_CACHED_INPUT_PRICE_MICROS_PER_MILLION:20000}
    output-price-micros-per-million: ${AI_OUTPUT_PRICE_MICROS_PER_MILLION:1200000}
    usage-timezone: ${AI_USAGE_TIMEZONE:Asia/Jakarta}
    minimum-automatic-signal-score: ${AI_MIN_AUTOMATIC_SIGNAL_SCORE:45}
    max-automatic-calls-per-hour: ${AI_MAX_AUTOMATIC_CALLS_PER_HOUR:12}
    max-automatic-calls-per-day: ${AI_MAX_AUTOMATIC_CALLS_PER_DAY:60}
    trigger-intervals:
      - 15m
      - 1h
      - 4h
      - 1d

  billing:
    enabled: ${AI_BILLING_REMINDER_ENABLED:false}
    due-day: ${AI_BILLING_DUE_DAY:1}
    reminder-days-before: ${AI_BILLING_REMINDER_DAYS:2}
    timezone: ${AI_BILLING_TIMEZONE:Asia/Jakarta}
    provider: ${AI_BILLING_PROVIDER:OPENAI}
    cron: ${AI_BILLING_CRON:0 0 9 * * *}

  push:
    enabled: ${WEB_PUSH_ENABLED:false}
    public-key: ${WEB_PUSH_PUBLIC_KEY:}
    private-key: ${WEB_PUSH_PRIVATE_KEY:}
    subject: ${WEB_PUSH_SUBJECT:mailto:admin@example.com}
  market:
    binance-websocket-base-url: ${BINANCE_WS_URL:wss://data-stream.binance.vision}
    binance-rest-base-url: ${BINANCE_REST_URL:https://data-api.binance.vision}
    historical-candle-limit: ${HISTORICAL_CANDLE_LIMIT:500}
    symbols:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
    intervals:
      - 1m
      - 5m
      - 15m
      - 1h
      - 4h
      - 1d

  news:
    enabled: ${NEWS_ENABLED:false}
    refresh-interval-ms: ${NEWS_REFRESH_INTERVAL_MS:300000}
    retention-enabled: ${NEWS_RETENTION_ENABLED:true}
    hot-retention-days: ${NEWS_HOT_RETENTION_DAYS:30}
    archive-retention-days: ${NEWS_ARCHIVE_RETENTION_DAYS:365}
    retention-cron: ${NEWS_RETENTION_CRON:0 15 3 * * *}
    rss-urls:
      - ${NEWS_RSS_COINDESK:https://www.coindesk.com/arc/outboundfeeds/rss/}
      - ${NEWS_RSS_COINTELEGRAPH:https://cointelegraph.com/rss}
